name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core claims to have no dependencies. This job is what makes that a
  # claim rather than an aspiration: it installs the package with no extras at
  # all and runs everything that does not need the emit backend.
  bare:
    name: "zero-dependency core (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with no extras
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Confirm nothing optional leaked into the install
        run: |
          python - <<'EOF'
          import importlib.util, sys
          for name in ("scenariogeneration", "numpy", "lanelet2"):
              if importlib.util.find_spec(name) is not None:
                  sys.exit(f"{name} is installed; this job must prove the core runs without it")
          import opendrive_transpiler
          print("core imports cleanly:", opendrive_transpiler.__version__)
          EOF
      - name: Transpile a fixture without the emit backend
        run: |
          python -m opendrive_transpiler tests/fixtures/chain.py --best-effort -o /dev/null
      - name: Run the dependency-free tests
        run: pytest tests -q

  full:
    name: "full suite (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the emit and validate extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validate]"
      - name: Run everything, including the .xodr round-trip
        run: pytest tests -q
      - name: Produce a .xodr end to end
        run: |
          python -m opendrive_transpiler tests/fixtures/parallel_lanes.py \
            --best-effort -o /tmp/generated.py --xodr /tmp/generated.xodr
          python -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/generated.xodr')"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  goldens:
    name: goldens are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Regenerating must be a no-op; a dirty tree means someone changed the
      # emitter without refreshing tests/golden.
      - run: pytest tests/integration/test_golden.py --update-golden -q
      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --quiet -- tests/golden; then
            echo "::error::goldens are stale; run: pytest tests/integration/test_golden.py --update-golden"
            git --no-pager diff -- tests/golden
            exit 1
          fi
